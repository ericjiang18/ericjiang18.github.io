<!doctype html>
<html lang="en" data-theme="dark" data-accent="blue">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ site.title | escape }}</title>
    <meta name="description" content="Eric Hanchen Jiang is a Ph.D. student at UCLA researching large language model reasoning, safety, and agents. Looking for 2027 internship opportunities.">
    <meta name="author" content="{{ site.author.name | escape }}">
    <meta name="color-scheme" content="dark light">
    <meta property="og:title" content="{{ site.title | escape }}">
    <meta property="og:description" content="UCLA · Large language models, reasoning, safety, and agents.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="{{ '/' | absolute_url }}">
    <meta property="og:image" content="{{ '/images/profile/01-snow.jpg' | absolute_url }}">
    <link rel="canonical" href="{{ page.url | absolute_url }}">
    <link rel="icon" href="{{ '/assets/favicon.svg' | relative_url }}" type="image/svg+xml">
    <script>
      try {
        var theme = localStorage.getItem('eric-theme');
        var accent = localStorage.getItem('eric-accent');
        if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
        if (['blue', 'purple', 'green', 'rose', 'amber'].indexOf(accent) !== -1) document.documentElement.dataset.accent = accent;
      } catch (error) { /* The page also works when browser storage is unavailable. */ }
    </script>
    <link rel="stylesheet" href="{{ '/assets/css/profile.css' | relative_url }}?v={{ site.time | date: '%s' }}">
    <link rel="preload" href="{{ '/assets/fonts/zhi-mang-xing-name.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
    <link rel="preload" as="image" href="{{ '/images/profile/01-snow.webp' | relative_url }}">
    <script src="{{ '/assets/js/profile.js' | relative_url }}" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to content</a>
    <header class="site-header">
      <div class="header-inner">
        <nav class="social-links" aria-label="Contact and social profiles">
          <a href="mailto:{{ site.author.email }}" aria-label="Email Eric" title="Email"><span class="icon icon-solid" aria-hidden="true">&#xf0e0;</span></a>
          <a href="{{ site.author.googlescholar }}" target="_blank" rel="noopener noreferrer" aria-label="Google Scholar" title="Google Scholar"><svg class="scholar-icon" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2 0 10l4.8 3.2A7.5 7.5 0 1 0 19.2 13.2L24 10ZM12 10a5.5 5.5 0 1 1 0 11 5.5 5.5 0 0 1 0-11Z"/></svg></a>
          <a href="https://github.com/{{ site.author.github }}" target="_blank" rel="noopener noreferrer" aria-label="GitHub" title="GitHub"><span class="icon icon-brand" aria-hidden="true">&#xf09b;</span></a>
          <a href="https://www.linkedin.com/in/{{ site.author.linkedin }}/" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn" title="LinkedIn"><span class="icon icon-brand" aria-hidden="true">&#xf0e1;</span></a>
          <a href="https://twitter.com/{{ site.author.twitter }}" target="_blank" rel="noopener noreferrer" aria-label="Twitter / X" title="Twitter / X"><span class="icon icon-brand" aria-hidden="true">&#xf099;</span></a>
          <a href="https://www.instagram.com/{{ site.author.instagram }}/" target="_blank" rel="noopener noreferrer" aria-label="Instagram" title="Instagram"><span class="icon icon-brand" aria-hidden="true">&#xf16d;</span></a>
          <a class="wechat-link" href="{{ '/images/profile/wechat-qr.jpg' | relative_url }}" aria-label="WeChat QR code" title="WeChat" aria-haspopup="dialog" aria-controls="wechat-dialog"><span class="icon icon-brand" aria-hidden="true">&#xf1d7;</span></a>
          <a href="{{ '/assets/pdf/eric_resume.pdf' | relative_url }}" target="_blank" rel="noopener" aria-label="Download CV (PDF)" title="CV (PDF)"><span class="icon icon-solid" aria-hidden="true">&#xf1c1;</span></a>
        </nav>
        <nav class="page-navigation" aria-label="Main navigation">
          <a href="#about-me" class="active" aria-current="location">About</a>
          <a href="#publications">Publications</a>
          <button class="icon-button theme-toggle" type="button" aria-label="Switch to light theme" title="Switch to light theme">
            <svg class="sun-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.4 1.4m11.2 11.2L19 19M5 19l1.4-1.4M17.6 6.4 19 5"/></svg>
            <svg class="moon-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.8 14.1A9 9 0 0 1 9.9 3.2 9 9 0 1 0 20.8 14.1Z"/></svg>
          </button>
        </nav>
      </div>
      <div class="reading-progress" aria-hidden="true"></div>
    </header>

    <main class="page-shell" id="main-content" tabindex="-1">{{ content }}</main>

    <footer class="site-footer">
      <div class="footer-inner">
        <span>© {{ site.time | date: '%Y' }} {{ site.author.name }}.</span>
        <span>Built with <a href="https://jekyllrb.com/" target="_blank" rel="noopener noreferrer">Jekyll</a> · Design inspired by <a href="https://leoii22.com/" target="_blank" rel="noopener noreferrer">Tianyang Liu</a></span>
      </div>
    </footer>

    <dialog id="wechat-dialog" class="wechat-dialog" aria-labelledby="wechat-title" aria-describedby="wechat-description">
      <div class="dialog-heading">
        <h2 id="wechat-title">Connect on WeChat</h2>
        <button class="icon-button dialog-close" type="button" aria-label="Close WeChat QR code" autofocus><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M6 18 18 6"/></svg></button>
      </div>
      <p id="wechat-description">Scan the QR code in WeChat to add me.</p>
      <img src="{{ '/images/profile/wechat-qr.jpg' | relative_url }}" alt="Eric’s WeChat contact card and QR code" width="888" height="1131" loading="lazy">
      <a class="qr-download" href="{{ '/images/profile/wechat-qr.jpg' | relative_url }}" download="eric-wechat.jpg">Save QR code <span aria-hidden="true">↓</span></a>
    </dialog>

    <div class="accent-control">
      <div class="accent-options" id="accent-options" role="group" aria-label="Accent color" hidden>
        <button type="button" data-color="blue" aria-label="Blue accent" aria-pressed="true" title="Blue"></button>
        <button type="button" data-color="purple" aria-label="Purple accent" aria-pressed="false" title="Purple"></button>
        <button type="button" data-color="green" aria-label="Green accent" aria-pressed="false" title="Green"></button>
        <button type="button" data-color="rose" aria-label="Rose accent" aria-pressed="false" title="Rose"></button>
        <button type="button" data-color="amber" aria-label="Amber accent" aria-pressed="false" title="Amber"></button>
      </div>
      <button class="accent-toggle" type="button" aria-label="Change accent color" aria-expanded="false" aria-controls="accent-options" title="Change accent color"><span aria-hidden="true"></span></button>
    </div>
  </body>
</html>
